name: WhatsApp automation checks
on:
  push:
    branches: [main]
    paths: ['main/whatsapp.js', 'main/windows/**', 'main/settings.js', 'tests/whatsapp.test.js', 'scripts/test-whatsapp-helper.ps1', '.github/workflows/whatsapp-checks.yml']
  pull_request:
    paths: ['main/whatsapp.js', 'main/windows/**', 'main/settings.js', 'tests/whatsapp.test.js', 'scripts/test-whatsapp-helper.ps1', '.github/workflows/whatsapp-checks.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/whatsapp.test.js
      - name: Compile and check Windows accessibility helper
        run: powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-whatsapp-helper.ps1
