name: WhatsApp automation checks
on:
  push:
    branches: [main]
    paths: ['main/whatsapp.js', 'main/whatsweb.js', 'main/windows/**', 'main/settings.js', 'tests/whatsapp.test.js', 'tests/whatsweb.test.js', 'tests/WhatsApp*.cs', 'scripts/test-whatsapp*.ps1', 'scripts/test-whatsweb*.js', 'package-lock.json', '.github/workflows/whatsapp-checks.yml']
  pull_request:
    paths: ['main/whatsapp.js', 'main/whatsweb.js', 'main/windows/**', 'main/settings.js', 'tests/whatsapp.test.js', 'tests/whatsweb.test.js', 'tests/WhatsApp*.cs', 'scripts/test-whatsapp*.ps1', 'scripts/test-whatsweb*.js', 'package-lock.json', '.github/workflows/whatsapp-checks.yml']
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/whatsapp.test.js tests/whatsweb.test.js
      - name: WhatsApp Web engine reaches the QR code (headless Edge)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $env:ELECTRON_RUN_AS_NODE = '1'
          $out = & ./node_modules/.bin/electron.cmd scripts/test-whatsweb-qr.js 2>&1
          $code = $LASTEXITCODE
          foreach ($line in $out) {
            $text = ("$line" -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($text -match '^(PASS|SKIP)') { "::notice title=WhatsApp Web engine::$text" } elseif ($text -match '^FAIL') { "::error title=WhatsApp Web engine::$text" } else { $text }
          }
          if ($code -ne 0) { "::error title=WhatsApp Web engine failed::exit $code"; exit $code }
      - name: Packaged app - the engine works from inside the installer build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          npm run sprites | Out-Null
          npx electron-builder --win dir --publish never 2>&1 | Select-Object -Last 3
          if (-not (Test-Path dist/win-unpacked/Shadow.exe)) { "::error title=Packaged engine::the app did not build"; exit 1 }
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:SHADOW_APP_DIR = (Resolve-Path dist/win-unpacked/resources/app.asar).Path
          # Shadow.exe is a windowed app: PowerShell only waits for it (and gets its output) through Start-Process
          $p = Start-Process -FilePath dist/win-unpacked/Shadow.exe -ArgumentList 'scripts/test-whatsweb-qr.js' -NoNewWindow -Wait -PassThru -RedirectStandardOutput packaged-out.txt -RedirectStandardError packaged-err.txt
          $code = $p.ExitCode
          $out = @(Get-Content packaged-out.txt) + @(Get-Content packaged-err.txt)
          foreach ($line in $out) {
            $text = ("$line" -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($text -match '^(PASS|SKIP)') { "::notice title=Packaged engine::$text" } elseif ($text -match '^FAIL') { "::error title=Packaged engine::$text" } else { $text }
          }
          if ($code -ne 0) { "::error title=Packaged engine failed::exit $code"; exit 1 }
          if (-not ($out -match '^PASS WhatsApp Web loaded')) { "::error title=Packaged engine::no QR code result from the packaged app (output: $($out -join ' | '))"; exit 1 }
      # Each PASS/SKIP line becomes a notice and any failure becomes an error annotation with its message,
      # so results are readable from the run summary (and the checks API) without opening the raw log.
      - name: Compile and check Windows accessibility helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            & ./scripts/test-whatsapp-helper.ps1 | ForEach-Object { if ("$_" -match '^(PASS|SKIP)') { "::notice title=WhatsApp helper::$_" } else { "$_" } }
          } catch {
            $detail = (($_ | Out-String) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            "::error title=WhatsApp helper failed::$detail"
            exit 1
          }
      - name: Native chat selection, typing and call fixtures
        shell: powershell
        run: |
          # GitHub runs this shell with ErrorActionPreference=Stop; keep going so the fixture's own error is reported
          $ErrorActionPreference = 'Continue'
          $out = powershell.exe -NoLogo -NoProfile -NonInteractive -MTA -ExecutionPolicy Bypass -File scripts/test-whatsapp-ui.ps1 2>&1
          $code = $LASTEXITCODE
          foreach ($line in $out) {
            $text = ("$line" -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')
            if ($text -match '^(PASS|SKIP)') { "::notice title=WhatsApp UI fixture::$text" } else { $text }
          }
          if ($code -ne 0) { "::error title=WhatsApp UI fixture failed::$(($out | Out-String) -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A')"; exit $code }
