# Builds the Windows installer on every push to main and publishes it as a GitHub Release.
# Installed copies of Shadow find it there and update themselves (main/updater.js).
#
# Version = <major.minor from package.json>.<run number>, e.g. 1.0.7, so every build is newer
# than the last without anyone editing package.json.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'assets/preview/**']
  workflow_dispatch: {}

permissions:
  contents: write # create the release + upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run sprites

      - name: Set version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          npm version --no-git-tag-version "$base.$((GITHUB_RUN_NUMBER))"
          node -p "'Building Shadow ' + require('./package.json').version"

      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis --publish never 2>&1 | tee build.log || {
            tail -n 40 build.log | sed 's/^/::error::/'
            exit 1
          }
          ls -l dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          # latest.yml tells installed copies which version is newest; the .blockmap lets them
          # download only the parts that changed
          gh release create "v$v" "dist/Shadow-Setup-$v.exe" "dist/Shadow-Setup-$v.exe.blockmap" dist/latest.yml \
            --target "$GITHUB_SHA" --title "Shadow $v" --notes "$(git log -1 --pretty=%s)"
